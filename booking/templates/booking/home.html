{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>SnipTime</title>
    <link rel="stylesheet" href="{% static 'booking/style.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        {% if user.is_authenticated %}
            <a href="{% url 'service_list' %}">Services</a>
            <a href="{% url 'my_appointments' %}">My Appointments</a>
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>

    <div class="container">
        <h1>Welcome to SnipTime</h1>

        {% if user.is_authenticated %}
            <p>Hello, {{ user.username }}! You are logged in.</p>
        {% else %}
            <p>You are not logged in.</p>
        {% endif %}
    </div>
</body>
</html>
