{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Register - SnipTime</title>
    <link rel="stylesheet" href="{% static 'booking/style.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'login' %}">Login</a>
    </nav>

    <div class="container">
        <h1>Create an Account</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        <p><a href="{% url 'login' %}">Already have an account? Login here</a></p>
    </div>
</body>
</html>
