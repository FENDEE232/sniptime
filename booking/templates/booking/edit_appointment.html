{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Appointment - SnipTime</title>
    <link rel="stylesheet" href="{% static 'booking/style.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'service_list' %}">Services</a>
        <a href="{% url 'my_appointments' %}">My Appointments</a>
        <a href="{% url 'logout' %}">Logout</a>
    </nav>

    <div class="container">
        <h1>Edit Appointment: {{ appointment.service.name }}</h1>

        {% if messages %}
            {% for message in messages %}
                <p class="error">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label>Date:</label><br>
            <input type="date" name="date" value="{{ appointment.date|date:'Y-m-d' }}" required><br><br>
            <label>Time:</label><br>
            <input type="time" name="time" value="{{ appointment.time|time:'H:i' }}" required><br><br>
            <button type="submit">Save Changes</button>
        </form>

        <p><a href="{% url 'my_appointments' %}">Back to My Appointments</a></p>
    </div>
</body>
</html>
